# Self-hosted n8n behind Caddy (automatic HTTPS).
# See ../SELF-HOSTING.md for the full setup. Copy this folder to the server as /opt/n8n.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    environment:
      # Public address: must match the Caddyfile and the DNS record.
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_PROXY_HOPS=1
      # Times in the editor and in the Schedule trigger.
      - GENERIC_TIMEZONE=Australia/Canberra
      - TZ=Australia/Canberra
      # Credentials are encrypted with this key. Losing it means re-entering every credential.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Workflow B runs every minute. Without pruning the database grows without end.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=20000
      # Required for the Code node on current n8n versions.
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
